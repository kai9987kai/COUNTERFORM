[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterform-lab"
version = "0.2.0"
description = "A CPU-local falsification-driven synthetic mechanical invention laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2"]

[project.scripts]
counterform = "counterform.__main__:main"

[project.urls]
Repository = "https://github.com/kai9987kai/COUNTERFORM"

[tool.setuptools.packages.find]
include = ["counterform*"]

[tool.setuptools.package-data]
counterform = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
