name: COUNTERFORM verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Official Python 3.12.10 binaries support Ubuntu 24.04; latest now uses 26.04.
        os: [windows-latest, ubuntu-24.04]
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-validated.txt
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
      - run: python -m pytest -q
      - run: python -m counterform verify runs/benchmark/cubic/11/counterform/evidence.zip
